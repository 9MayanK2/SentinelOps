apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: {{ .Values.namespace }}

  labels:
    app: backend

spec:

  replicas: {{ .Values.backend.replicaCount }}

  selector:
    matchLabels:
      app: backend

  strategy:

    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

        - name: backend

          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"

          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:

            - containerPort: {{ .Values.backend.service.port }}

          envFrom:

            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret

          resources:

            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:

            httpGet:
              path: /health
              port: {{ .Values.backend.service.port }}

            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:

            httpGet:
              path: /health
              port: {{ .Values.backend.service.port }}

            initialDelaySeconds: 30
            periodSeconds: 15