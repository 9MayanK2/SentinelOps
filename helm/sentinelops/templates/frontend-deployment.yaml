apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: {{ .Values.namespace }}

  labels:
    app: frontend

spec:

  replicas: {{ .Values.frontend.replicaCount }}

  selector:
    matchLabels:
      app: frontend

  strategy:

    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

        - name: frontend

          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"

          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}

          ports:

            - containerPort: {{ .Values.frontend.containerPort }}

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"

          readinessProbe:

            httpGet:
              path: /health
              port: {{ .Values.frontend.containerPort }}

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:

            httpGet:
              path: /health
              port: {{ .Values.frontend.containerPort }}

            initialDelaySeconds: 20
            periodSeconds: 10