##############################################################
# DevSecOps Security Framework Configuration
##############################################################

##############################################################
# Global Directories
##############################################################

REPORT_ROOT=compliance/reports
NORMALIZED_ROOT=compliance/normalized
LOG_ROOT=compliance/logs
TEMP_DIR=/tmp/devsecops

##############################################################
# Dockerfiles
##############################################################

BACKEND_DOCKERFILE=app/server/Dockerfile
FRONTEND_DOCKERFILE=app/client/Dockerfile

##############################################################
# Docker Images (Built by Project)
##############################################################

BACKEND_IMAGE=hopegivers-backend
FRONTEND_IMAGE=hopegivers-frontend

##############################################################
# Hadolint Configuration
##############################################################

HADOLINT_IMAGE=hadolint/hadolint:latest

HADOLINT_REPORT_DIR=${REPORT_ROOT}/hadolint
HADOLINT_OUTPUT_FORMAT=json
HADOLINT_REPORT_PREFIX=hadolint
HADOLINT_LOG_FILE=${LOG_ROOT}/hadolint.log

##############################################################
# Trivy Configuration
##############################################################

TRIVY_IMAGE=aquasec/trivy:latest

TRIVY_REPORT_DIR=${REPORT_ROOT}/trivy
TRIVY_OUTPUT_FORMAT=json
TRIVY_REPORT_PREFIX=trivy
TRIVY_LOG_FILE=${LOG_ROOT}/trivy.log

##############################################################
# Gitleaks Configuration
##############################################################

GITLEAKS_IMAGE=zricethezav/gitleaks:latest

GITLEAKS_REPORT_DIR=${REPORT_ROOT}/gitleaks
GITLEAKS_OUTPUT_FORMAT=json
GITLEAKS_REPORT_PREFIX=gitleaks
GITLEAKS_LOG_FILE=${LOG_ROOT}/gitleaks.log

##############################################################
# Report Retention
##############################################################

REPORT_RETENTION_DAYS=30

